name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Ruby ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ['3.3']
        
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
        
    - name: Install dependencies
      run: |
        go mod download
        bundle install
        
    - name: Build parser
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          make build
        else
          CGO_ENABLED=1 go build -buildmode=c-shared -ldflags="-s -w" -trimpath -o libmysql_parser.so ./parser.go
        fi
        
    - name: Run tests
      run: bundle exec rspec
      
    - name: Check for memory leaks (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind
        # Create a simple test script
        cat > test_memory.rb << 'EOF'
        require './lib/mysql_parser'
        100.times do
          MysqlParser.parse("SELECT * FROM users WHERE id = 1")
        end
        EOF
        # Run with valgrind (continue even if there are leaks for now)
        valgrind --leak-check=full --error-exitcode=1 ruby test_memory.rb || true

  build-binaries:
    name: Build binaries for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            goos: linux
            goarch: amd64
          - os: ubuntu-latest  
            platform: linux-arm64
            goos: linux
            goarch: arm64
          - os: macos-latest
            platform: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            platform: darwin-arm64
            goos: darwin
            goarch: arm64
            
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Build binary
      run: |
        CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -buildmode=c-shared -ldflags="-s -w" -trimpath \
          -o libmysql_parser-${{ matrix.platform }}.so ./parser.go
          
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libmysql_parser-${{ matrix.platform }}
        path: libmysql_parser-${{ matrix.platform }}.so

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Run Go linters
      run: |
        go fmt ./...
        go vet ./...
        
    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.54.0
        
    - name: Run golangci-lint
      run: $(go env GOPATH)/bin/golangci-lint run